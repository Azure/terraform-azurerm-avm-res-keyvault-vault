---
name: PR Check
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize', 'labeled', 'unlabeled']
  workflow_dispatch:
    inputs:
      authoringSource:
        description: 'Where to obtain the Avm.Authoring PowerShell module.'
        required: false
        type: choice
        options:
          - gallery
          - repo
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        required: false
        type: string
        default: ''

jobs:
  run-managed-workflow:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name != 'pull_request') ||
      !(
        (github.event.pull_request.user.login == 'azure-verified-modules[bot]') &&
        startsWith(github.head_ref, 'avm-bot/pre-commit-') &&
        (github.event.pull_request.base.repo.full_name == github.repository) &&
        (github.event.pull_request.head.repo.full_name == github.repository)
      )
    uses: Azure/azure-verified-modules-tools/.github/workflows/terraform-module.yml@bdcbf68e953ba573ffe825080dde492b2e53fbaa
    name: run managed workflow
    with:
      authoringSource: ${{ inputs.authoringSource || 'gallery' }}
      authoringRef: ${{ inputs.authoringRef || '' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: write
